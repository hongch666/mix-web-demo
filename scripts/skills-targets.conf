# mix-web-demo 项目技能包同步目标清单
#
# 每行一个 Agent 工具的用户级「技能根目录」，格式：<home>/<相对路径> [说明]
#   <home> 用户主目录（Linux/macOS 为 HOME，Windows 为 USERPROFILE）
# 行内第一个空白之后的内容视为注释，可写工具名称；以 # 开头的整行忽略
#
# 同步规则
#   1. 只同步本文件中「技能根目录已存在」的目标，不存在的目录不创建也不迁移
#   2. 需要同步到清单外的工具时，直接在文件末尾追加一行即可，由 scripts/skills-sync.sh 读取本清单
#   3. 技能目录名取 skills/SKILL.md frontmatter 的 name 字段，默认 mix-web-demo
#   4. 同步为镜像覆盖，目标下同名技能目录里多余的旧文件会被清理
#   5. 只维护用户级技能目录，仓库内的项目级技能目录不在同步范围内

# ===== 用户级技能目录（本机 Agent 工具的全局技能）=====
<home>/.codebuddy/skills     CodeBuddy
<home>/.workbuddy/skills     WorkBuddy
<home>/.claude/skills        Claude Code
<home>/.codex/skills         OpenAI Codex CLI
<home>/.agents/skills        Agent Skills 通用约定
