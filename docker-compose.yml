services:
  loki-data-init:
    image: grafana/loki:3.0.0
    user: "0:0"
    entrypoint: ["/bin/sh"]
    command: ["-c", "mkdir -p /tmp/loki && chown -R 10001:10001 /tmp/loki"]
    volumes:
      - loki-data:/tmp/loki
    networks:
      - hcsy

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: ["-config.file=/etc/loki/config.yaml"]
    depends_on:
      loki-data-init:
        condition: service_completed_successfully
    volumes:
      - ./loki-config/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/tmp/loki
    networks:
      - hcsy
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  promtail:
    image: grafana/promtail:2.9.7
    container_name: promtail
    command: ["-config.file=/etc/promtail/config.yaml"]
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./loki-config/promtail.yaml:/etc/promtail/config.yaml:ro
      - ./logs:/app/logs:ro
      - promtail-data:/tmp/positions
    networks:
      - hcsy
    healthcheck:
      test: ["CMD-SHELL", "test -r /etc/promtail/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    depends_on:
      loki:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./loki-config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - hcsy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  gateway-log-init:
    image: apache/apisix:3.11.0-debian
    user: "0:0"
    entrypoint: ["/bin/sh"]
    command: ["-c", "chown -R 636:636 /logs"]
    volumes:
      - ./logs/gateway:/logs

  # 修正业务服务日志目录属主，避免容器以 root/内置用户创建日志文件后，宿主机开发模式（./mix dev seq）因无写权限导致 FileNotFoundException，宿主 uid/gid 与宿主机不一致时，通过环境变量 HOST_UID / HOST_GID 覆盖
  logs-owner-init:
    image: alpine:3.20
    user: "0:0"
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - "mkdir -p /logs/spring /logs/gozero /logs/nestjs /logs/fastapi && chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} /logs/spring /logs/gozero /logs/nestjs /logs/fastapi"
    volumes:
      - ./logs:/logs

  gateway:
    image: apache/apisix:3.11.0-debian
    container_name: mix-gateway
    depends_on:
      gateway-log-init:
        condition: service_completed_successfully
    ports:
      - "8080:9080"
    volumes:
      - ./gateway/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./gateway/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./gateway/swagger-ui:/usr/local/apisix/html/swagger-ui:ro
      - ./logs/gateway:/usr/local/apisix/logs
    networks:
      - hcsy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "test -s /usr/local/apisix/logs/nginx.pid && kill -0 $(cat /usr/local/apisix/logs/nginx.pid)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  spring:
    image: mix-spring:latest
    container_name: mix-spring
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      logs-owner-init:
        condition: service_completed_successfully
    env_file:
      - ./spring/.env.docker
    ports:
      - "8081:8081"
    environment:
      HOME: /tmp
      NACOS_SERVER: nacos:8848
      DB_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: mq
    volumes:
      - ./spring/src/main/resources/application.yaml:/app/application.yaml:ro
      - ./logs/spring:/app/logs/spring
      - ./static/pic:/app/static/pic
      - ./static/excel:/app/static/excel
      - ./static/upload:/app/static/upload
    networks:
      - hcsy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/test/spring"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  gozero:
    image: mix-gozero:latest
    container_name: mix-gozero
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      logs-owner-init:
        condition: service_completed_successfully
    env_file:
      - ./gozero/app/.env.docker
    ports:
      - "8082:8082"
    environment:
      HOME: /tmp
      SERVER_IP: 0.0.0.0
      NACOS_IP: nacos
      DB_MYSQL_HOST: mysql
      DB_ES_HOST: es
      DB_MONGODB_HOST: mongodb
      RABBITMQ_HOST: mq
      LOGS_PATH: /app/logs/gozero
    volumes:
      - ./gozero/app/etc:/app/etc:ro
      - ./logs/gozero:/app/logs/gozero
      - ./static/pic:/app/static/pic
      - ./static/excel:/app/static/excel
      - ./static/upload:/app/static/upload
    networks:
      - hcsy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/test/gozero"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nestjs:
    image: mix-nestjs:latest
    container_name: mix-nestjs
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      logs-owner-init:
        condition: service_completed_successfully
    env_file:
      - ./nestjs/.env.docker
    ports:
      - "8083:8083"
    environment:
      HOME: /tmp
      SERVER_IP: 0.0.0.0
      NACOS_SERVER: nacos
      NACOS_PORT: 8848
      DB_HOST: mysql
      DB_MONGODB_HOST: mongodb
      RABBITMQ_HOST: mq
      LOGS_PATH: /app/logs/nestjs
    volumes:
      - ./nestjs/src/config/application.yaml:/app/dist/config/application.yaml:ro
      - ./logs/nestjs:/app/logs/nestjs
      - ./static/pic:/app/static/pic
      - ./static/excel:/app/static/excel
      - ./static/upload:/app/static/upload
    networks:
      - hcsy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/test/nestjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  fastapi:
    image: mix-fastapi:latest
    container_name: mix-fastapi
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      logs-owner-init:
        condition: service_completed_successfully
    env_file:
      - ./fastapi/.env.docker
    ports:
      - "8084:8084"
    environment:
      HOME: /tmp
      SERVER_IP: 0.0.0.0
      NACOS_SERVER: nacos:8848
      RABBITMQ_HOST: mq
      DB_MYSQL_HOST: mysql
      DB_POSTGRES_HOST: pgvector-db
      DB_MONGODB_HOST: mongodb
      DB_REDIS_HOST: redis
      DB_CLICKHOUSE_HOST: clickhouse
      LOGS_PATH: /app/logs/fastapi
    volumes:
      - ./fastapi/application.yaml:/app/application.yaml:ro
      - ./logs/fastapi:/app/logs/fastapi
      - ./static/pic:/app/static/pic
      - ./static/excel:/app/static/excel
      - ./static/upload:/app/static/upload
    networks:
      - hcsy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/test/fastapi', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  hcsy:
    external: true

volumes:
  loki-data:
  promtail-data:
  grafana-data:
