name: Release Images

# 触发：
#   push prod    → 构建并推送 :sha短号 与 :latest（生产分支，WSL 部署的镜像来源）
#   push tag v*  → 追加 :vX.Y.Z（配合 GitHub Release）
#   workflow_dispatch → 手工补建镜像
#
# 构建位置：GitHub 托管 runner（ACR 个人版公网端点可达）。
# 若镜像仓库换成企业版 VPC 端点或内网 Harbor，把 runs-on 改为 [self-hosted, linux, x64, builder]。
on:
  push:
    branches: [prod]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'db/**'
      - 'scripts/**'
      - 'skills/**'
      - 'static/**'
      - 'loki-config/**'
      - 'otel-config/**'
      - 'prometheus-config/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  # 推镜像到 GHCR 需要 packages: write
  packages: write
  security-events: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 变更检测：只构建改动的服务，避免改一个服务也全量构建 4 个镜像
  changes:
    name: 变更检测
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.plan.outputs.services }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            spring:
              - 'spring/**'
            gozero:
              - 'gozero/**'
            nestjs:
              - 'nestjs/**'
            fastapi:
              - 'fastapi/**'

      - id: plan
        name: 计算本次需要构建的服务
        env:
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
          CHANGED_SPRING: ${{ steps.filter.outputs.spring }}
          CHANGED_GOZERO: ${{ steps.filter.outputs.gozero }}
          CHANGED_NESTJS: ${{ steps.filter.outputs.nestjs }}
          CHANGED_FASTAPI: ${{ steps.filter.outputs.fastapi }}
        run: |
          set -euo pipefail
          list=()
          # 打 tag 或手工触发时全量构建，保证一个版本号对应完整的 4 个镜像
          if [ "$REF_TYPE" = "tag" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            list=(spring gozero nestjs fastapi)
          else
            if [ "$CHANGED_SPRING" = "true" ]; then list+=(spring); fi
            if [ "$CHANGED_GOZERO" = "true" ]; then list+=(gozero); fi
            if [ "$CHANGED_NESTJS" = "true" ]; then list+=(nestjs); fi
            if [ "$CHANGED_FASTAPI" = "true" ]; then list+=(fastapi); fi
          fi
          count=${#list[@]}
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "services=$(printf '%s\n' "${list[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          # 供 deploy.yml 读取的清单（每行一个服务名；无变更写 none，部署侧据此跳过容器更新）
          if [ "$count" -eq 0 ]; then
            echo none > "$RUNNER_TEMP/deploy-plan.txt"
          else
            printf '%s\n' "${list[@]}" > "$RUNNER_TEMP/deploy-plan.txt"
          fi
          echo "::notice::本次构建服务: ${list[*]:-无}"

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-plan
          path: ${{ runner.temp }}/deploy-plan.txt
          retention-days: 3

  build:
    name: Build / ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验镜像仓库配置
        env:
          PREFIX: ${{ vars.DOCKER_IMAGE_PREFIX }}
        run: |
          # 变量用方括号包裹打印，便于看出首尾空格等隐藏字符（变量非机密可直接打印）
          echo "prefix=[$PREFIX]"
          if [ -z "$PREFIX" ]; then
            echo "::error::仓库变量 DOCKER_IMAGE_PREFIX 未配置，应形如 ghcr.io/<owner>/<repo>/ （以 / 结尾）"
            exit 1
          fi
          # GHCR 探针：401 = 域名正常（需要鉴权）；其它值说明网络或地址异常
          code="$(curl -s -o /dev/null -m 10 -w '%{http_code}' https://ghcr.io/v2/ || echo ERR)"
          echo "ghcr.io /v2/ = $code"
          {
            echo "### 镜像仓库"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 前缀 | \`$PREFIX\` |"
            echo "| ghcr.io /v2/ | $code（401=正常） |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      # GHCR 使用 GitHub 内置 GITHUB_TOKEN，无需任何自定义 Secret
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_IMAGE_PREFIX }}mix-${{ matrix.service }}
          tags: |
            # 唯一真相：部署与回滚只用短 sha
            type=sha,format=short,prefix=
            # latest 跟随 prod 分支；打 tag 时不会打 latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            # v1.2.3 → 1.2.3
            type=semver,pattern={{version}}

      # 缓存后端用 registry（GHCR 里的 buildcache tag）：
      # gha 缓存有 10GB/仓库上限，4 个大镜像很快挤满，导致 npm ci 层被淘汰后反复全量下载
      # （Dockerfile 里的 --mount=type=cache 只在同一次构建内有效，不跨 run）
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.DOCKER_IMAGE_PREFIX }}mix-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_IMAGE_PREFIX }}mix-${{ matrix.service }}:buildcache,mode=max

  scan:
    name: Scan / ${{ matrix.service }}
    needs: [changes, build]
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ref
        run: echo "image=${{ vars.DOCKER_IMAGE_PREFIX }}mix-${{ matrix.service }}:${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # 只报告不阻断（exit-code 0）：漏洞绝大部分来自上游基础镜像（alpine/java/node/python），
      # 让它阻断发布会卡住整条链路；报告仍上传到 Security 标签页，定期升级基线镜像后再改为阻断
      # 注意：该仓库的 release tag 带 v 前缀（v0.36.0），不是 0.36.0
      - id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
