name: CI

# 触发（main 为开发分支，不触发任何 CI/CD）：
#   pull_request      → prod 质量门禁（合并前必须全绿）
#   push prod         → 合并后复验一次，防止绕过 PR 的 merge commit
#   workflow_dispatch → 手工只跑指定服务，便于排障
on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      services:
        description: 只跑指定服务（空格分隔：spring gozero nestjs fastapi），留空按变更检测
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

# 同一分支连续推送时取消旧任务，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI_STRICT=1：把脚本里「工具缺失就跳过」的降级行为升级为失败，避免门禁假绿
  CI_STRICT: "1"
  # 与本地开发对齐的工具版本，升级前先确认本地 golangci-lint / goctl 版本
  # golangci-lint 必须用 v2：gozero/app/.golangci.yml 是 v2 配置，v1 会直接报错
  GOLANGCI_LINT_VERSION: v2.15.0
  GOCTL_VERSION: v1.10.0

jobs:
  # ---------------------------------------------------------------------------
  # 变更检测：算出每个服务是否受影响（JSON），供 quality matrix 判定快速通过或真实执行
  # ---------------------------------------------------------------------------
  changes:
    name: 变更检测
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.plan.outputs.affected }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # 与质量门禁的输入对齐：测试代码变更照常触发对应服务的 lint/compile/test
            # 与 release.yml 的区别：CD 跳过测试与非构建文件，CI 仍校验 .api 格式与生成一致性
            spring:
              - 'spring/pom.xml'
              - 'spring/eclipse-formatter.xml'
              - 'spring/src/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            gozero:
              - 'gozero/app/**'
              - 'gozero/app/.golangci.yml'
              - 'gozero/api/**'
              - 'gozero/template/**'
              - 'gozero/script/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            nestjs:
              - 'nestjs/package*.json'
              - 'nestjs/tsconfig*.json'
              - 'nestjs/eslint.config.mjs'
              - 'nestjs/.prettierrc'
              - 'nestjs/nest-cli.json'
              - 'nestjs/src/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            fastapi:
              - 'fastapi/requirements.txt'
              - 'fastapi/pyproject.toml'
              - 'fastapi/uv.lock'
              - 'fastapi/main.py'
              - 'fastapi/app/**'
              - 'fastapi/tests/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

      - id: plan
        name: 计算各服务是否受影响
        env:
          MANUAL: ${{ inputs.services }}
          CHANGED_SPRING: ${{ steps.filter.outputs.spring }}
          CHANGED_GOZERO: ${{ steps.filter.outputs.gozero }}
          CHANGED_NESTJS: ${{ steps.filter.outputs.nestjs }}
          CHANGED_FASTAPI: ${{ steps.filter.outputs.fastapi }}
        run: |
          set -euo pipefail
          # 手工触发时以参数为准，否则以路径过滤结果为准
          if [ -n "${MANUAL:-}" ]; then
            CHANGED_SPRING=false; CHANGED_GOZERO=false; CHANGED_NESTJS=false; CHANGED_FASTAPI=false
            for svc in $MANUAL; do
              case "$svc" in
                spring)  CHANGED_SPRING=true ;;
                gozero)  CHANGED_GOZERO=true ;;
                nestjs)  CHANGED_NESTJS=true ;;
                fastapi) CHANGED_FASTAPI=true ;;
              esac
            done
          fi
          flag() { [ "$1" = "true" ] && echo true || echo false; }
          affected="$(printf '{"spring":%s,"gozero":%s,"nestjs":%s,"fastapi":%s}' \
            "$(flag "$CHANGED_SPRING")" "$(flag "$CHANGED_GOZERO")" \
            "$(flag "$CHANGED_NESTJS")" "$(flag "$CHANGED_FASTAPI")")"
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          echo "::notice::受影响情况: $affected"

  # ---------------------------------------------------------------------------
  # 质量门禁：复用本地同一套脚本（lint.sh / compile.sh / test.sh），判据完全一致
  # 固定产出 4 个检查结果——未变更的服务快速通过（秒级 no-op），
  # 否则分支保护的 required checks 会永远停留在 Expected，PR 无法合并
  # ---------------------------------------------------------------------------
  quality:
    name: Quality / ${{ matrix.service }}
    needs: changes
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: [spring, gozero, nestjs, fastapi]
    steps:
      - uses: actions/checkout@v4

      - name: 变更判定
        id: gate
        env:
          AFFECTED: ${{ fromJson(needs.changes.outputs.affected)[matrix.service] }}
        run: |
          if [ "$AFFECTED" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.service }} 无代码变更，本次门禁快速通过"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------- spring：JDK 17 + Maven ----------
      - if: steps.gate.outputs.run == 'true' && matrix.service == 'spring'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: spring/pom.xml

      # ---------- gozero：Go + golangci-lint + goctl ----------
      - if: steps.gate.outputs.run == 'true' && matrix.service == 'gozero'
        uses: actions/setup-go@v5
        with:
          go-version-file: gozero/app/go.mod
          cache-dependency-path: gozero/app/go.sum

      - if: steps.gate.outputs.run == 'true' && matrix.service == 'gozero'
        name: 安装 golangci-lint 与 goctl
        run: |
          set -euo pipefail
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # 不用官方 install.sh：它对部分 release（如 v2.15.0）会因 checksums 文件与产物不匹配而误报，
          # 直接下载官方 tar 包解压
          curl -sSfL \
            "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64.tar.gz" \
            | tar xz -C /tmp
          mv "/tmp/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64/golangci-lint" \
            "$(go env GOPATH)/bin/golangci-lint"
          golangci-lint version
          # GOWORK=off：仓库根目录有 go.work，workspace 模式下 go install pkg@version 会报错
          # 固定版本拉取失败时回退 latest，避免上游仓库抖动阻断门禁
          GOWORK=off go install "github.com/zeromicro/go-zero/tools/goctl@${GOCTL_VERSION}" \
            || GOWORK=off go install github.com/zeromicro/go-zero/tools/goctl@latest
          goctl --version

      # ---------- nestjs：Node 20 + npm（脚本走 npm run lint / tsc，不用 bun） ----------
      - if: steps.gate.outputs.run == 'true' && matrix.service == 'nestjs'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nestjs/package-lock.json

      - if: steps.gate.outputs.run == 'true' && matrix.service == 'nestjs'
        name: 安装依赖（npm ci）
        working-directory: nestjs
        run: npm ci --no-audit --no-fund

      # ---------- fastapi：Python 3.12 + uv（dev 组含 ruff/pyright） ----------
      - if: steps.gate.outputs.run == 'true' && matrix.service == 'fastapi'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: fastapi/uv.lock

      - if: steps.gate.outputs.run == 'true' && matrix.service == 'fastapi'
        name: 安装依赖（uv sync --frozen）
        working-directory: fastapi
        run: uv sync --frozen

      - if: steps.gate.outputs.run == 'true' && matrix.service == 'fastapi'
        name: 将 venv 加入 PATH（lint.sh 通过 command -v 探测 ruff/pyright）
        run: echo "$PWD/fastapi/.venv/bin" >> "$GITHUB_PATH"

      # ---------- 统一门禁 ----------
      - name: lint → compile → test
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          SVC="${{ matrix.service }}"
          bash scripts/quality/lint.sh "$SVC"
          bash scripts/quality/compile.sh "$SVC"
          bash scripts/quality/test.sh "$SVC"

  # ---------------------------------------------------------------------------
  # 文档一致性：重新生成静态 OpenAPI 产物并与仓库产物比对，发现「改了接口没跑 ./mix swag」
  # 固定产出单个 check（docs-consistency），未变更时快速通过，满足分支保护 required check
  # ---------------------------------------------------------------------------
  docs-consistency:
    name: Docs Consistency
    needs: changes
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 文档产物或网关黑名单单独变更时也要全量检测：网关黑名单会注入各服务 403 响应说明
      - id: artifacts
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - 'spring/docs/**'
              - 'gozero/app/docs/**'
              - 'nestjs/docs/**'
              - 'fastapi/docs/**'
              - 'scripts/generated/**'
              - 'gateway/**'

      - id: gate
        name: 计算需要校验文档的服务
        env:
          AFFECTED: ${{ needs.changes.outputs.affected }}
          ARTIFACTS_CHANGED: ${{ steps.artifacts.outputs.changed }}
        run: |
          set -euo pipefail
          services=""
          if [ "$ARTIFACTS_CHANGED" = "true" ]; then
            services="spring gozero nestjs fastapi"
          else
            for svc in spring gozero nestjs fastapi; do
              if [ "$(echo "$AFFECTED" | jq -r ".$svc")" = "true" ]; then
                services="$services $svc"
              fi
            done
          fi
          services="$(echo $services | xargs)"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          if [ -n "$services" ]; then
            echo "::notice::本次文档一致性检测服务: $services"
          else
            echo "::notice::无服务与产物变更，文档检测快速通过"
          fi

      # ---------- spring：JDK 17 + Maven（生成器走 mvn test -Dtest=OpenApiDocGenerator）----------
      - if: contains(steps.gate.outputs.services, 'spring')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: spring/pom.xml

      # ---------- gozero：Go + goctl + swagger2openapi + PyYAML ----------
      - if: contains(steps.gate.outputs.services, 'gozero')
        uses: actions/setup-go@v5
        with:
          go-version-file: gozero/app/go.mod
          cache-dependency-path: gozero/app/go.sum

      # genSwagger.sh 的 fix.py 依赖 PyYAML，且它探测的是 python（跳过 /usr/bin 系统解释器）
      # 显式 setup-python 让 python 落在 tool cache 路径，下面用同一个 python 安装，避免 python/python3 环境不一致
      - if: contains(steps.gate.outputs.services, 'gozero')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - if: contains(steps.gate.outputs.services, 'gozero')
        name: 安装 goctl 与文档后处理依赖
        run: |
          set -euo pipefail
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          GOWORK=off go install "github.com/zeromicro/go-zero/tools/goctl@${GOCTL_VERSION}" \
            || GOWORK=off go install github.com/zeromicro/go-zero/tools/goctl@latest
          goctl --version
          npm install -g swagger2openapi
          python -m pip install pyyaml
          python -c "import yaml; print('PyYAML', yaml.__version__)"

      # ---------- nestjs：Node 20 + npm ci + Bun（生成器必须用 Bun 加载 ESM 依赖）----------
      - if: contains(steps.gate.outputs.services, 'nestjs')
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nestjs/package-lock.json

      - if: contains(steps.gate.outputs.services, 'nestjs')
        name: 安装依赖与 Bun
        run: |
          set -euo pipefail
          (cd nestjs && npm ci --no-audit --no-fund)
          npm install -g bun
          bun --version

      # ---------- fastapi：Python 3.12 + uv ----------
      - if: contains(steps.gate.outputs.services, 'fastapi')
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: fastapi/uv.lock

      - if: contains(steps.gate.outputs.services, 'fastapi')
        name: 安装依赖（uv sync --frozen）
        working-directory: fastapi
        run: uv sync --frozen

      - name: 校验 OpenAPI 产物一致性
        if: steps.gate.outputs.services != ''
        env:
          SERVICES: ${{ steps.gate.outputs.services }}
        run: |
          set -euo pipefail
          # 诊断：记录 PATH 与各解释器解析结果，便于定位 venv 污染与 PyYAML 归属
          echo "::group::解释器诊断"
          echo "PATH=$PATH"
          echo "VIRTUAL_ENV=${VIRTUAL_ENV:-<unset>}"
          for c in python python3; do
            resolved="$(command -v "$c" 2>/dev/null || echo MISSING)"
            echo "$c -> $resolved"
            if [ "$resolved" != "MISSING" ]; then
              "$resolved" -c 'import sys; print("  version:", sys.version.split()[0]); import yaml; print("  PyYAML:", yaml.__version__)' 2>/dev/null \
                || echo "  PyYAML: NOT INSTALLED"
            fi
          done
          echo "::endgroup::"
          # setup-uv 会把根目录 .venv/bin 注入 PATH 并设 VIRTUAL_ENV，该环境没有 PyYAML，
          # genSwagger.sh 的自动探测会误选它。这里显式解析出装了 PyYAML 的解释器传给下游
          SWAGGER_PYTHON=""
          for candidate in python python3; do
            resolved="$(command -v "$candidate" 2>/dev/null || true)"
            case "$resolved" in
              */.venv/bin/*|*/site-packages/*) continue ;;
            esac
            if [ -n "$resolved" ] && "$resolved" -c 'import yaml' >/dev/null 2>&1; then
              SWAGGER_PYTHON="$resolved"
              break
            fi
          done
          if [ -z "$SWAGGER_PYTHON" ]; then
            # 兜底：setup-python 的解释器（PATH 里非 venv 的那个）当场补装 PyYAML
            for candidate in python python3; do
              resolved="$(command -v "$candidate" 2>/dev/null || true)"
              case "$resolved" in
                */.venv/bin/*) continue ;;
              esac
              if [ -n "$resolved" ]; then
                "$resolved" -m pip install pyyaml
                SWAGGER_PYTHON="$resolved"
                break
              fi
            done
          fi
          echo "SWAGGER_PYTHON=$SWAGGER_PYTHON"
          export SWAGGER_PYTHON
          echo "执行: ./mix swag-check $SERVICES"
          bash scripts/docs/swag-check.sh $SERVICES
