name: CI

# 触发（main 为开发分支，不触发任何 CI/CD）：
#   pull_request      → prod 质量门禁（合并前必须全绿）
#   push prod         → 合并后复验一次，防止绕过 PR 的 merge commit
#   workflow_dispatch → 手工只跑指定服务，便于排障
on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      services:
        description: 只跑指定服务（空格分隔：spring gozero nestjs fastapi），留空按变更检测
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

# 同一分支连续推送时取消旧任务，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI_STRICT=1：把脚本里「工具缺失就跳过」的降级行为升级为失败，避免门禁假绿
  CI_STRICT: "1"
  # 与本地开发对齐的工具版本，升级前先确认本地 golangci-lint / goctl 版本
  # golangci-lint 必须用 v2：gozero/app/.golangci.yml 是 v2 配置，v1 会直接报错
  GOLANGCI_LINT_VERSION: v2.15.0
  GOCTL_VERSION: v1.10.0

jobs:
  # ---------------------------------------------------------------------------
  # 变更检测：算出每个服务是否受影响（JSON），供 quality matrix 判定快速通过或真实执行
  # ---------------------------------------------------------------------------
  changes:
    name: 变更检测
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.plan.outputs.affected }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            spring:
              - 'spring/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            gozero:
              - 'gozero/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            nestjs:
              - 'nestjs/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            fastapi:
              - 'fastapi/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

      - id: plan
        name: 计算各服务是否受影响
        env:
          MANUAL: ${{ inputs.services }}
          CHANGED_SPRING: ${{ steps.filter.outputs.spring }}
          CHANGED_GOZERO: ${{ steps.filter.outputs.gozero }}
          CHANGED_NESTJS: ${{ steps.filter.outputs.nestjs }}
          CHANGED_FASTAPI: ${{ steps.filter.outputs.fastapi }}
        run: |
          set -euo pipefail
          # 手工触发时以参数为准，否则以路径过滤结果为准
          if [ -n "${MANUAL:-}" ]; then
            CHANGED_SPRING=false; CHANGED_GOZERO=false; CHANGED_NESTJS=false; CHANGED_FASTAPI=false
            for svc in $MANUAL; do
              case "$svc" in
                spring)  CHANGED_SPRING=true ;;
                gozero)  CHANGED_GOZERO=true ;;
                nestjs)  CHANGED_NESTJS=true ;;
                fastapi) CHANGED_FASTAPI=true ;;
              esac
            done
          fi
          flag() { [ "$1" = "true" ] && echo true || echo false; }
          affected="$(printf '{"spring":%s,"gozero":%s,"nestjs":%s,"fastapi":%s}' \
            "$(flag "$CHANGED_SPRING")" "$(flag "$CHANGED_GOZERO")" \
            "$(flag "$CHANGED_NESTJS")" "$(flag "$CHANGED_FASTAPI")")"
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          echo "::notice::受影响情况: $affected"

  # ---------------------------------------------------------------------------
  # 质量门禁：复用本地同一套脚本（lint.sh / compile.sh / test.sh），判据完全一致
  # 固定产出 4 个检查结果——未变更的服务快速通过（秒级 no-op），
  # 否则分支保护的 required checks 会永远停留在 Expected，PR 无法合并
  # ---------------------------------------------------------------------------
  quality:
    name: Quality / ${{ matrix.service }}
    needs: changes
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: [spring, gozero, nestjs, fastapi]
    steps:
      - uses: actions/checkout@v4

      - name: 变更判定
        id: gate
        env:
          AFFECTED: ${{ fromJson(needs.changes.outputs.affected)[matrix.service] }}
        run: |
          if [ "$AFFECTED" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.service }} 无代码变更，本次门禁快速通过"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------- spring：JDK 17 + Maven ----------
      - if: steps.gate.outputs.run == 'true' && matrix.service == 'spring'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: spring/pom.xml

      # ---------- gozero：Go + golangci-lint + goctl ----------
      - if: steps.gate.outputs.run == 'true' && matrix.service == 'gozero'
        uses: actions/setup-go@v5
        with:
          go-version-file: gozero/app/go.mod
          cache-dependency-path: gozero/app/go.sum

      - if: steps.gate.outputs.run == 'true' && matrix.service == 'gozero'
        name: 安装 golangci-lint 与 goctl
        run: |
          set -euo pipefail
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # 不用官方 install.sh：它对部分 release（如 v2.15.0）会因 checksums 文件与产物不匹配而误报，
          # 直接下载官方 tar 包解压
          curl -sSfL \
            "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64.tar.gz" \
            | tar xz -C /tmp
          mv "/tmp/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64/golangci-lint" \
            "$(go env GOPATH)/bin/golangci-lint"
          golangci-lint version
          # GOWORK=off：仓库根目录有 go.work，workspace 模式下 go install pkg@version 会报错
          # 固定版本拉取失败时回退 latest，避免上游仓库抖动阻断门禁
          GOWORK=off go install "github.com/zeromicro/go-zero/tools/goctl@${GOCTL_VERSION}" \
            || GOWORK=off go install github.com/zeromicro/go-zero/tools/goctl@latest
          goctl --version

      # ---------- nestjs：Node 20 + npm（脚本走 npm run lint / tsc，不用 bun） ----------
      - if: steps.gate.outputs.run == 'true' && matrix.service == 'nestjs'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nestjs/package-lock.json

      - if: steps.gate.outputs.run == 'true' && matrix.service == 'nestjs'
        name: 安装依赖（npm ci）
        working-directory: nestjs
        run: npm ci --no-audit --no-fund

      # ---------- fastapi：Python 3.12 + uv（dev 组含 ruff/pyright） ----------
      - if: steps.gate.outputs.run == 'true' && matrix.service == 'fastapi'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: fastapi/uv.lock

      - if: steps.gate.outputs.run == 'true' && matrix.service == 'fastapi'
        name: 安装依赖（uv sync --frozen）
        working-directory: fastapi
        run: uv sync --frozen

      - if: steps.gate.outputs.run == 'true' && matrix.service == 'fastapi'
        name: 将 venv 加入 PATH（lint.sh 通过 command -v 探测 ruff/pyright）
        run: echo "$PWD/fastapi/.venv/bin" >> "$GITHUB_PATH"

      # ---------- 统一门禁 ----------
      - name: lint → compile → test
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          SVC="${{ matrix.service }}"
          bash scripts/lint.sh "$SVC"
          bash scripts/compile.sh "$SVC"
          bash scripts/test.sh "$SVC"
