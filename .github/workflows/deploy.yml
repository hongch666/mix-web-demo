name: Deploy

# 生产部署（WSL 内网，自托管 runner，仅出站 443，无任何入站要求）
#
# 触发：
#   1. workflow_run：Release Images 在 prod 分支构建成功后自动部署（受 environment 审批保护）
#   2. release published：发布 GitHub Release 时部署对应 tag
#   3. workflow_dispatch：手工部署 / 回滚，image_tag 填短 sha 或 vX.Y.Z
#
# 部署机要求（一次配置，见 README 或交接说明）：
#   - 自托管 runner，labels 含 deploy（svc.sh 注册为 systemd 服务）
#   - 仓库克隆于仓库变量 DEPLOY_DIR（如 /home/hongch666/mix-web-demo），
#     并备好 .env（DOCKER_IMAGE_PREFIX / HOST_UID / HOST_GID）与四个 .env.docker
#     （这些文件被 gitignore，部署目录不随 checkout 重置，正好保留）
#   - runner 用户具备 docker 权限
on:
  workflow_run:
    workflows: [Release Images]
    types: [completed]
    branches: [prod]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 镜像 tag（短 sha 或 vX.Y.Z）；留空则部署 prod 最新 commit 的短 sha
        required: false
        type: string

permissions:
  contents: read
  # 从 GHCR 拉取镜像需要 packages: read
  packages: read
  # workflow_run 触发时下载上游 Release Images 的制品（deploy-plan）需要 actions: read
  actions: read

# 部署全局互斥：同 group 的两次部署排队执行，不取消进行中的那次
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署到生产（WSL）
    runs-on: [self-hosted, linux, x64, deploy]
    environment: production
    timeout-minutes: 30
    steps:
      - name: 上游结果检查
        id: guard
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::notice::上游 Release Images 结论为 ${{ github.event.workflow_run.conclusion }}，跳过部署"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步部署目录到目标版本
        id: sync
        if: steps.guard.outputs.skip != 'true'
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          # workflow_run 事件的 GITHUB_SHA 指向默认分支头，不是触发构建的 commit；
          # 必须用触发工作流的 head_sha，否则会部署错版本
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="${{ vars.DEPLOY_DIR }}"
          if [ -z "$DEPLOY_DIR" ] || [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "::error::仓库变量 DEPLOY_DIR 未配置，或目录不是 git 仓库: $DEPLOY_DIR"
            exit 1
          fi
          cd "$DEPLOY_DIR"
          # 每次部署都先从远端拉取（等价于 git fetch + 检查最新 prod），不再依赖人工去 WSL 手动 pull
          git fetch origin --prune --tags
          prod_head="$(git rev-parse origin/prod)"

          if [ -n "${INPUT_TAG:-}" ]; then
            # 手工指定版本（部署/回滚到某个具体镜像）
            tag="$INPUT_TAG"
            if [[ "$tag" == v* ]]; then
              commit="$(git rev-list -n 1 "refs/tags/$tag")"
            else
              commit="$tag"
            fi
          elif [ -n "${WORKFLOW_SHA:-}" ]; then
            # 自动部署：跟随「触发构建的那个提交」，保证部署的就是构建出来的
            commit="$WORKFLOW_SHA"
            tag="${commit:0:7}"
          else
            # 手工触发且未指定 image_tag：直接跟 prod 最新提交，把 compose / workflow 等改动一并同步下来
            commit="$prod_head"
            tag="${commit:0:7}"
            echo "::notice::未指定 image_tag，同步到 prod 最新提交 ${commit:0:7}"
          fi
          git cat-file -e "${commit}^{commit}" 2>/dev/null \
            || { echo "::error::提交不存在: $commit（在部署目录执行 git fetch origin main 后重试）"; exit 1; }
          prev_commit="$(git rev-parse HEAD)"
          # 用 -B 把本地 prod 分支固定到目标提交，而不是 --detach：
          # detached HEAD 会让部署机上的 git pull 报「not currently on a branch」，
          # 运维手动拉取/排障就被卡住了
          git checkout -f -B prod "$commit"
          git reset --hard "$commit"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "prev_commit=$prev_commit" >> "$GITHUB_OUTPUT"
          echo "deploy_dir=$DEPLOY_DIR" >> "$GITHUB_OUTPUT"
          echo "::notice::目标版本 tag=$tag（上一版本 ${prev_commit:0:7}）"

      - name: 部署前检查
        if: steps.sync.outputs.tag
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.deploy_dir }}"
          command -v docker >/dev/null || { echo "::error::docker 不可用"; exit 1; }
          docker compose version >/dev/null || { echo "::error::docker compose v2 不可用"; exit 1; }
          [ -f .env ] || { echo "::error::缺少 .env（需含 DOCKER_IMAGE_PREFIX，建议含 HOST_UID/HOST_GID）"; exit 1; }
          grep -q '^DOCKER_IMAGE_PREFIX=' .env || { echo "::error::.env 缺少 DOCKER_IMAGE_PREFIX"; exit 1; }
          for f in spring/.env.docker gozero/app/.env.docker nestjs/.env.docker fastapi/.env.docker; do
            [ -f "$f" ] || echo "::warning::缺少 $f"
          done
          # 前置条件：部署机 .env 的 DOCKER_IMAGE_PREFIX 必须与构建产物一致（GHCR）
          if ! grep -q '^DOCKER_IMAGE_PREFIX=ghcr\.io/' .env; then
            echo "::error::.env 的 DOCKER_IMAGE_PREFIX 应为 ghcr.io/<owner>/<repo>/ 前缀，否则 compose 拉不到本次构建的镜像"
            exit 1
          fi

      - name: 下载本次构建清单
        if: steps.sync.outputs.tag && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: deploy-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/deploy-plan

      - name: 解析部署范围
        id: plan
        if: steps.sync.outputs.tag
        run: |
          set -euo pipefail
          plan=""
          f="${{ runner.temp }}/deploy-plan/deploy-plan.txt"
          if [ -f "$f" ]; then
            plan="$(tr '\n' ' ' < "$f" | xargs)"
          fi
          # 取不到清单（手工触发 / Release 事件 / 制品过期）时按全量部署，保证不遗漏服务
          if [ -z "$plan" ]; then
            plan="all"
            echo "::notice::未取到构建清单，按全量部署处理"
          fi
          echo "services=$plan" >> "$GITHUB_OUTPUT"
          echo "::notice::本次部署服务: $plan"

      - name: 登录镜像仓库（GHCR）
        if: steps.sync.outputs.tag
        run: |
          # GHCR 用 GITHUB_TOKEN 登录，无需自定义 Secret（job 已声明 packages: read）
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 拉取镜像并启动（失败自动回滚）
        if: steps.sync.outputs.tag
        env:
          TAG: ${{ steps.sync.outputs.tag }}
          COMMIT: ${{ steps.sync.outputs.commit }}
          PLAN: ${{ steps.plan.outputs.services }}
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.deploy_dir }}"
          state_dir="${RUNNER_WORKSPACE}/mix-deploy-state"
          mkdir -p "$state_dir"
          # 状态文件按服务记录当前运行的 tag（每行 "服务=tag"），供精准部署与回滚使用
          state_file="$state_dir/last-deploy.txt"
          prev_tag() { grep -E "^$1=" "$state_file" 2>/dev/null | head -1 | cut -d= -f2 || true; }
          set_tag() {
            local svc="$1" tag="$2" tmp="$state_file.tmp"
            { grep -vE "^$svc=" "$state_file" 2>/dev/null || true; echo "$svc=$tag"; } > "$tmp"
            mv "$tmp" "$state_file"
          }

          BUSINESS="spring gozero nestjs fastapi"

          # 各服务目标 tag：本次变更的服务用新 TAG，其余沿用已部署版本
          t_spring=""; t_gozero=""; t_nestjs=""; t_fastapi=""
          set_t() { case $1 in spring) t_spring=$2;; gozero) t_gozero=$2;; nestjs) t_nestjs=$2;; fastapi) t_fastapi=$2;; esac; }
          get_t() { case $1 in spring) echo "$t_spring";; gozero) echo "$t_gozero";; nestjs) echo "$t_nestjs";; fastapi) echo "$t_fastapi";; esac; }

          # 通过 compose 的分服务变量逐个指定版本，避免「一个 tag 覆盖全部服务」
          dc() {
            DOCKER_IMAGE_TAG_SPRING="$t_spring" \
            DOCKER_IMAGE_TAG_GOZERO="$t_gozero" \
            DOCKER_IMAGE_TAG_NESTJS="$t_nestjs" \
            DOCKER_IMAGE_TAG_FASTAPI="$t_fastapi" \
              docker compose "$@"
          }

          PREFIX="${{ vars.DOCKER_IMAGE_PREFIX }}"

          # CONFIG_ONLY=true：没有新镜像，只同步代码与配置（compose / restart 策略 / env 等）
          if [ "$PLAN" = "none" ]; then
            CONFIG_ONLY=true
          else
            if [ "$PLAN" = "all" ]; then CANDIDATES="$BUSINESS gateway"; else CANDIDATES="$PLAN"; fi
            # 预检：过滤掉仓库里不存在该 tag 的服务（清单缺失走 all 兜底 / 某服务构建失败时）
            CHANGED=""
            for svc in $CANDIDATES; do
              if [ "$svc" = "gateway" ] || docker manifest inspect "${PREFIX}mix-${svc}:${TAG}" >/dev/null 2>&1; then
                CHANGED="$CHANGED $svc"
              else
                echo "::warning::${PREFIX}mix-${svc}:${TAG} 不存在，跳过该服务"
              fi
            done
            CHANGED="$(echo $CHANGED)"
            if [ -z "$CHANGED" ]; then
              # 例如只改了 .github/ 或 compose：没有镜像，退化为配置同步
              CONFIG_ONLY=true
            else
              CONFIG_ONLY=false
            fi
          fi

          if [ "$CONFIG_ONLY" = true ]; then
            CHANGED=""
            for svc in $BUSINESS; do set_t "$svc" "$(prev_tag "$svc")"; done
            echo "::notice::本次没有可部署的新镜像，按已部署版本重建以应用配置变更"
          else
            for svc in $BUSINESS; do
              case " $CHANGED " in
                *" $svc "*) set_t "$svc" "$TAG" ;;
                *) set_t "$svc" "$(prev_tag "$svc")" ;;
              esac
            done
          fi

          # 既不在本次变更内、又没有部署记录的服务无法确定版本，直接失败（避免误用 latest）
          for svc in $BUSINESS; do
            if [ -z "$(get_t "$svc")" ]; then
              echo "::error::$svc 不在本次变更内且没有部署记录，无法确定运行版本（先做一次全量部署）"
              exit 1
            fi
          done
          echo "本次部署: 新tag=$TAG 变更=[${CHANGED:-无}] 版本: spring=$(get_t spring) gozero=$(get_t gozero) nestjs=$(get_t nestjs) fastapi=$(get_t fastapi)"

          # 拉取变更服务的镜像，并二次确认已在本地：
          # compose 在 up 阶段才发现缺镜像时，会先把旧容器停掉再失败，造成「服务全停但没人拉起」
          if [ -n "$CHANGED" ]; then
            dc pull $CHANGED
            for svc in $CHANGED; do
              [ "$svc" = "gateway" ] && continue
              if ! docker image inspect "${PREFIX}mix-${svc}:${TAG}" >/dev/null 2>&1; then
                echo "::error::本地缺少镜像 ${PREFIX}mix-${svc}:${TAG}，已中止部署（容器未改动）"
                exit 1
              fi
            done
          fi

          # 统一走「全栈 up」：compose 只会重建 tag 发生变化的容器（已实测），
          # 未变更的服务保持 Running，缺失的服务（如被误删的可观测组件）会被重新创建。
          # 这样既不会牵连无关服务，也不会漏掉整套栈。
          if ! dc up -d --wait --wait-timeout 300; then
            echo "::error::部署失败（新 tag=$TAG）"
            for svc in $CHANGED; do
              [ "$svc" = "gateway" ] && continue
              prev="$(prev_tag "$svc")"
              if [ -z "$prev" ] || [ "$prev" = "$TAG" ]; then continue; fi
              echo "回滚 $svc → $prev"
              set_t "$svc" "$prev"
              dc pull "$svc" || true
              dc up -d --wait --wait-timeout 300 \
                || echo "::warning::$svc 回滚失败，需要人工介入"
            done
            exit 1
          fi

          for svc in $CHANGED; do
            [ "$svc" = "gateway" ] && continue
            set_tag "$svc" "$TAG"
          done
          set_tag "__commit__" "$COMMIT"
          echo "::notice::部署完成: 新tag=$TAG 变更=[${CHANGED:-无}]"

      - name: 网关配置变更时重启 APISIX
        if: steps.sync.outputs.tag
        run: |
          cd "${{ steps.sync.outputs.deploy_dir }}"
          # APISIX 只在启动时读配置，bind mount 变更不会触发容器重建，需显式重启
          if git diff --name-only "${{ steps.sync.outputs.prev_commit }}" "${{ steps.sync.outputs.commit }}" -- gateway/ | grep -q .; then
            echo "检测到 gateway 配置变更，重启网关加载新配置..."
            docker compose restart gateway
          fi
