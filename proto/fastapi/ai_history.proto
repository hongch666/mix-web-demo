// Server: fastapi
// Consumers: gozero
syntax = "proto3";
package fastapi.v1;
option go_package = "app/proto/fastapiv1";
import "common/result.proto";

service AiHistory {
  rpc Get (common.v1.JsonRequest) returns (common.v1.Result);
  rpc Update (common.v1.JsonRequest) returns (common.v1.Result);
  rpc Delete (common.v1.JsonRequest) returns (common.v1.Result);
}
