// Server: gozero
// Consumers: fastapi
syntax = "proto3";
package gozero.v1;
option go_package = "app/proto/gozerov1";
import "common/result.proto";

service GozeroSqlTools {
  rpc Tables (common.v1.JsonRequest) returns (common.v1.Result);
  rpc Query (common.v1.JsonRequest) returns (common.v1.Result);
}
