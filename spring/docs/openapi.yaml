openapi: "3.0.1"
info:
  title: "Spring部分的Swagger文档"
  description: "这是项目的Spring部分的Swagger文档"
  version: "1.0.0"
tags:
- name: "用户模块"
  description: "用户管理功能相关API，包括用户注册、登录、信息管理、验证码等"
- name: "权威参考文本模块"
  description: "分类权威参考文本相关API，包括参考文本增删改查等"
- name: "定时任务模块"
  description: "手动触发定时任务相关API"
- name: "评论模块"
  description: "文章评论功能相关API，包括评论发布、回复、删除、评论列表查询等"
- name: "SQL工具"
  description: "供FastAPI Agent远程调用的SQL工具接口"
- name: "用户关注模块"
  description: "用户关注功能相关API，包括关注、取消关注、关注列表、粉丝列表、关注统计等"
- name: "文章点赞模块"
  description: "文章点赞功能相关API，包括文章点赞、取消点赞、点赞状态查询、点赞统计等"
- name: "分类模块"
  description: "文章分类管理相关API，包括分类增删改查、子分类管理、层级查询等"
- name: "文章收藏模块"
  description: "文章收藏功能相关API，包括收藏、取消收藏、收藏列表查询、收藏统计等"
- name: "文章模块"
  description: "文章管理功能相关API，包括文章增删改查、搜索排序等"
- name: "测试模块"
  description: "服务测试相关API，用于验证各个微服务是否正常运行"
paths:
  /users:
    get:
      tags:
      - "用户模块"
      summary: "获取用户信息"
      description: "分页获取用户信息列表，并支持用户名模糊查询，实时返回用户登录状态和设备数"
      operationId: "listUsers"
      parameters:
      - name: "page"
        in: "query"
        description: "页码"
        required: false
        schema:
          minimum: 1
          type: "string"
          description: "页码"
          example: 1
        example: 1
      - name: "size"
        in: "query"
        description: "每页条数"
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: "string"
          description: "每页条数"
          example: 10
        example: 10
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultUserListVO"
    put:
      tags:
      - "用户模块"
      summary: "修改用户"
      description: "通过请求体修改用户信息"
      operationId: "updateUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
    post:
      tags:
      - "用户模块"
      summary: "新增用户"
      description: "创建新用户，如果不传密码则使用配置中的默认密码"
      operationId: "addUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultLong"
  /users/status/{id}:
    put:
      tags:
      - "用户模块"
      summary: "修改用户状态"
      description: "根据用户ID修改用户状态（存储在Redis中）"
      operationId: "updateUserStatus"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "integer"
          format: "int64"
      - name: "status"
        in: "query"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /comments:
    get:
      tags:
      - "评论模块"
      summary: "获取普通评论信息"
      description: "分页获取普通评论信息列表，并支持用户名和文章标题模糊查询"
      operationId: "listComments"
      parameters:
      - name: "page"
        in: "query"
        description: "页码"
        required: false
        schema:
          type: "string"
          description: "页码"
          example: 1
        example: 1
      - name: "size"
        in: "query"
        description: "每页条数"
        required: false
        schema:
          type: "string"
          description: "每页条数"
          example: 10
        example: 10
      - name: "username"
        in: "query"
        description: "用户名（模糊匹配）"
        required: false
        schema:
          type: "string"
          description: "用户名（模糊匹配）"
      - name: "article_title"
        in: "query"
        description: "文章标题（模糊匹配）"
        required: false
        schema:
          type: "string"
          description: "文章标题（模糊匹配）"
      - name: "content"
        in: "query"
        description: "评论内容（模糊匹配）"
        required: false
        schema:
          type: "string"
          description: "评论内容（模糊匹配）"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultPageVOCommentsVO"
    put:
      tags:
      - "评论模块"
      summary: "修改评论"
      description: "通过请求体修改评论信息"
      operationId: "updateComment"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentUpdateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
    post:
      tags:
      - "评论模块"
      summary: "新增评论"
      description: "通过请求体创建评论信息"
      operationId: "createComment"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultLong"
  /category:
    put:
      tags:
      - "分类模块"
      summary: "修改分类"
      description: "管理员修改文章分类信息，修改结果同步更新 Neo4j 图谱并记录操作日志"
      operationId: "updateCategory"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
    post:
      tags:
      - "分类模块"
      summary: "新增分类"
      description: "管理员新增文章分类，分类信息同步写入 Neo4j 图谱并记录操作日志"
      operationId: "addCategory"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultLong"
  /category/sub:
    put:
      tags:
      - "分类模块"
      summary: "修改子分类"
      description: "管理员修改指定子分类信息，修改结果同步更新 Neo4j 图谱并记录操作日志"
      operationId: "updateSubCategory"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubCategoryUpdateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
    post:
      tags:
      - "分类模块"
      summary: "新增子分类"
      description: "管理员在指定分类下新增子分类，同步写入 Neo4j 图谱并记录操作日志"
      operationId: "addSubCategory"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubCategoryCreateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultLong"
  /category/reference:
    put:
      tags:
      - "权威参考文本模块"
      summary: "修改权威参考文本"
      description: "管理员修改指定子分类下的权威参考文本内容"
      operationId: "updateCategoryReference"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryReferenceUpdateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
    post:
      tags:
      - "权威参考文本模块"
      summary: "创建权威参考文本"
      description: "管理员在指定子分类下创建权威参考文本内容"
      operationId: "addCategoryReference"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryReferenceCreateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /articles:
    put:
      tags:
      - "文章模块"
      summary: "更新文章"
      description: "根据DTO更新文章信息"
      operationId: "updateArticle"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleUpdateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
    post:
      tags:
      - "文章模块"
      summary: "创建文章"
      description: "通过请求体创建一篇新文章"
      operationId: "createArticle"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleCreateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultLong"
  /articles/view/{id}:
    put:
      tags:
      - "文章模块"
      summary: "增加文章阅读量"
      description: "增加文章阅读量"
      operationId: "addViewArticle"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "integer"
          format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /articles/publish/{id}:
    put:
      tags:
      - "文章模块"
      summary: "发布文章"
      description: "将文章状态修改为发布"
      operationId: "publishArticle"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "integer"
          format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /users/token/refresh:
    post:
      tags:
      - "用户模块"
      summary: "刷新 Token"
      description: "使用 refresh token 刷新 access token 和 refresh token，支持 token 轮换"
      operationId: "refreshToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultTokenRefreshVO"
  /users/reset-password:
    post:
      tags:
      - "用户模块"
      summary: "通过邮箱验证码重置密码"
      description: "用户通过邮箱验证码验证身份后重置密码"
      operationId: "resetPassword"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /users/register:
    post:
      tags:
      - "用户模块"
      summary: "用户注册"
      description: "注册新用户，需要提供邮箱验证码"
      operationId: "registerUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultLong"
  /users/logout:
    post:
      tags:
      - "用户模块"
      summary: "用户登出"
      description: "用户登出，从当前 access token 解析 session 并清除"
      operationId: "logout"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /users/login:
    post:
      tags:
      - "用户模块"
      summary: "用户登录"
      description: "根据用户名和密码进行登录，成功后返回JWT令牌，Token保存到Redis"
      operationId: "login"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultUserLoginVO"
  /users/kick-other-devices:
    post:
      tags:
      - "用户模块"
      summary: "踢出其他设备"
      description: "清除当前用户除本次请求携带的 access token 之外的所有 session（保留当前设备）"
      operationId: "kickOtherDevices"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultKickOtherDevicesVO"
  /users/github/token:
    post:
      tags:
      - "用户模块"
      summary: "获取 GitHub 登录 Token"
      description: "前端使用一次性 ticket 换取本站登录 token，成功后立即删除 ticket"
      operationId: "exchangeGithubToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubTokenExchangeDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultUserLoginVO"
  /users/github/token-ticket:
    post:
      tags:
      - "用户模块"
      summary: "生成 GitHub 登录票据"
      description: "在 GitHub 回调成功后生成本站登录票据"
      operationId: "createGithubTokenTicket"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubTokenTicketCreateDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultGithubTokenTicketVO"
  /users/github-user:
    post:
      tags:
      - "用户模块"
      summary: "创建或更新GitHub用户（内部）"
      description: "GitHub OAuth登录后创建或更新用户，供内部服务远程调用"
      operationId: "findOrCreateGithubUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubUserInternalDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultUserVO"
  /users/force-logout/{user_id}:
    post:
      tags:
      - "用户模块"
      summary: "手动下线用户"
      description: "管理员操作：将指定用户的所有登录会话强制下线"
      operationId: "forceLogoutUser"
      parameters:
      - name: "user_id"
        in: "path"
        required: true
        schema:
          type: "integer"
          format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /users/email/send:
    post:
      tags:
      - "用户模块"
      summary: "发送邮箱验证码"
      description: "向指定邮箱发送验证码，支持注册(register)和登录(login)两种场景"
      operationId: "sendVerificationCode"
      parameters:
      - name: "email"
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "type"
        in: "query"
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeSendDTO"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /users/email-login:
    post:
      tags:
      - "用户模块"
      summary: "邮箱验证码登录"
      description: "通过邮箱和验证码进行登录，成功后返回JWT令牌，Token保存到Redis"
      operationId: "emailLogin"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLoginDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultUserLoginVO"
  /users/batch:
    post:
      tags:
      - "用户模块"
      summary: "批量查询用户（内部）"
      description: "根据ID列表批量查询用户，供内部服务远程调用"
      operationId: "getUserByIds"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchIdsDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListUserVO"
  /users/admin/reset-password/{user_id}:
    post:
      tags:
      - "用户模块"
      summary: "管理员重置指定用户密码"
      description: "管理员操作：将指定用户ID的密码重置为配置中的重置密码"
      operationId: "resetUserPassword"
      parameters:
      - name: "user_id"
        in: "path"
        required: true
        schema:
          type: "integer"
          format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /users/admin/reset-all-passwords:
    post:
      tags:
      - "用户模块"
      summary: "管理员重置所有用户密码"
      description: "管理员操作：将所有用户密码重置为配置中的重置密码"
      operationId: "resetAllPasswords"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /task/clean:
    post:
      tags:
      - "定时任务模块"
      summary: "手动执行清理过期Token"
      description: "手动触发清理过期Token任务"
      operationId: "executeTokenCleanup"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /sql-tools/query:
    post:
      tags:
      - "SQL工具"
      summary: "执行只读SQL查询（内部）"
      description: "执行受限的只读参数化SQL查询，供FastAPI Agent远程调用"
      operationId: "executeQuery"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlQueryDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultSqlQueryResultVO"
  /likes:
    post:
      tags:
      - "文章点赞模块"
      summary: "添加点赞"
      description: "为文章添加点赞"
      operationId: "addLike"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleLikeDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
    delete:
      tags:
      - "文章点赞模块"
      summary: "取消点赞"
      description: "取消对文章的点赞"
      operationId: "removeLike"
      parameters:
      - name: "article_id"
        in: "query"
        description: "文章ID"
        required: true
        schema:
          type: "integer"
          format: "int64"
      - name: "user_id"
        in: "query"
        description: "用户ID"
        required: true
        schema:
          type: "integer"
          format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultVoid"
  /likes/counts/batch:
    post:
      tags:
      - "文章点赞模块"
      summary: "批量查询点赞数（内部）"
      description: "根据文章ID列表批量查询点赞数，供内部服务远程调用"
      operationId: "getLikeCountsByArticleIds"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchIdsDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultBatchCountVO"
  /focus:
    post:
      tags:
      - "用户关注模块"
      summary: "新增关注"
