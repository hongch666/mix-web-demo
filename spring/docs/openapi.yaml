components:
  schemas:
    UserUpdateDTO:
      required:
      - "age"
      - "email"
      - "id"
      - "name"
      type: "object"
      properties:
        password:
          pattern: "^$|^(?=.*[A-Za-z])(?=.*\\d).{8,20}$"
          type: "string"
          description: "登录密码，留空表示不修改"
        name:
          type: "string"
          description: "用户名"
        age:
          maximum: 150
          minimum: 0
          type: "integer"
          description: "年龄"
          format: "int32"
        email:
          type: "string"
          description: "邮箱"
        img:
          maxLength: 255
          minLength: 0
          type: "string"
          description: "头像地址"
        signature:
          maxLength: 255
          minLength: 0
          type: "string"
          description: "个性签名"
        id:
          minimum: 0
          type: "integer"
          description: "用户ID"
          format: "int32"
        role:
          pattern: "admin|user"
          type: "string"
          description: "角色，admin 或 user"
      description: "更新用户请求"
    ResultVoid:
      type: "object"
      properties:
        code:
          type: "integer"
          description: "响应码"
          format: "int32"
        msg:
          type: "string"
          description: "响应信息"
        data:
          type: "null"
          description: "返回数据"
          nullable: true
      description: "统一响应"
    CommentUpdateDTO:
      required:
      - "article_title"
      - "content"
      - "id"
      - "star"
      - "username"
      type: "object"
      properties:
        content:
          maxLength: 200
          minLength: 1
          type: "string"
          description: "评论内容"
        star:
          maximum: 10
          exclusiveMaximum: false
          minimum: 1
          exclusiveMinimum: false
          type: "number"
          description: "星级评分，1到10"
          format: "double"
        article_title:
          maxLength: 2147483647
          minLength: 1
          type: "string"
          description: "文章标题"
        username:
          maxLength: 2147483647
          minLength: 1
          type: "string"
          description: "评论用户名"
        id:
          minimum: 0
          type: "integer"
          description: "评论ID"
          format: "int32"
      description: "更新评论请求"
    CategoryUpdateDTO:
      required:
      - "id"
      - "name"
      type: "object"
      properties:
        id:
          type: "integer"
          description: "分类ID"
          format: "int64"
        name:
          type: "string"
          description: "分类名称"
      description: "更新分类请求"
    SubCategoryUpdateDTO:
      required:
      - "category_id"
      - "id"
      - "name"
      type: "object"
      properties:
        id:
          type: "integer"
          description: "子分类ID"
          format: "int64"
        name:
          type: "string"
          description: "子分类名称"
        category_id:
          type: "integer"
          description: "父分类ID"
          format: "int64"
      description: "更新子分类请求"
    CategoryReferenceUpdateDTO:
      required:
      - "sub_category_id"
      - "type"
      type: "object"
      properties:
        sub_category_id:
          type: "integer"
          description: "子分类ID"
          format: "int64"
        type:
          pattern: "^(link|pdf)$"
          type: "string"
          description: "类型，link 或 pdf"
        link:
          maxLength: 255
          minLength: 0
          type: "string"
          description: "官网链接，类型为 link 时必填"
        pdf:
          maxLength: 255
          minLength: 0
          type: "string"
          description: "PDF 链接，类型为 pdf 时必填"
      description: "更新权威参考文本请求"
    ArticleUpdateDTO:
      required:
      - "content"
      - "id"
      - "status"
      - "sub_category_id"
      - "title"
      - "username"
      type: "object"
      properties:
        title:
          maxLength: 200
          minLength: 1
          type: "string"
          description: "文章标题"
        content:
          type: "string"
          description: "文章内容"
        username:
          maxLength: 50
          minLength: 1
          type: "string"
          description: "作者用户名"
        tags:
          maxLength: 200
          minLength: 0
          type: "string"
          description: "标签，多个用英文逗号分隔"
        status:
          maximum: 1
          minimum: 0
          type: "integer"
          description: "状态，0草稿 1已发布"
          format: "int32"
        sub_category_id:
          minimum: 1
          type: "integer"
          description: "子分类ID"
          format: "int32"
        id:
