receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.x-internal-token
        action: delete
      - key: http.request.header.x_internal_token
        action: delete
  # 当前为全量采集，未启用采样，故不挂 tail_sampling：
  # 尾采样会引入 decision_wait(10s) 缓冲，使链路延迟可见并占用额外内存，全量场景下无收益
  # 如需恢复降采样，取消下方注释并把 tail_sampling 加回 service.pipelines.traces.processors
  # tail_sampling:
  #   decision_wait: 10s
  #   num_traces: 50000
  #   expected_new_traces_per_sec: 1000
  #   policies:
  #     - name: errors-policy
  #       type: status_code
  #       status_code:
  #         status_codes: [ERROR]
  #     - name: normal-traffic-policy
  #       type: probabilistic
  #       probabilistic:
  #         sampling_percentage: 10
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp/tempo]
  telemetry:
    logs:
      level: warn
