apisix:
  node_listen: 9080
  enable_ipv6: false
  proxy_mode: http
  enable_dev_mode: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
  admin:
    enable_admin: false

discovery:
  nacos:
    host:
      - "http://nacos:8848"
    prefix: "/nacos/v1/"
    fetch_interval: 5
    weight: 100
    timeout:
      connect: 2000
      send: 2000
      read: 5000

plugins:
  - mocking
  - cors
  - forward-auth
  - limit-req
  - proxy-rewrite
  - response-rewrite
  - opentelemetry
  - prometheus

nginx_config:
  # Nacos 发现只在 worker 0 拉全量，再经 events 广播给其它 worker：首次广播若早于某个 worker
  # 完成 init_worker，该 worker 的 applications 永远是 nil，而节点内容不变时 fetch 不会再 post
  # 事件，它会永久返回 503（failed to set upstream: no valid upstream node）。收敛到单 worker
  # 后由它自己拉取，彻底规避该竞态；网关只做转发，单 worker 足够本地栈使用。
  worker_processes: 1
  http:
    enable_access_log: true
    access_log_format: '{"time":"$time_iso8601","level":"INFO","trace_id":"$opentelemetry_trace_id","remote_addr":"$remote_addr","request":"$request","status":$status,"request_time":$request_time}'
    access_log_format_escape: json
  http_configuration_snippet: |
    proxy_buffering off;
  http_server_configuration_snippet: |
    location /swagger-ui/ {
        alias /usr/local/apisix/html/swagger-ui/;
        index index.html;
        try_files $uri $uri/ /swagger-ui/index.html;
    }
  # 只记录 error：warn 里全是插件加载清单与 http 明文 TLS 提示，每个 worker 启动都重复刷一遍
  error_log_level: error

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    metric_prefix: apisix_
    enable_export_server: true
    export_addr:
      ip: 0.0.0.0
      port: 9091
    # extra_labels 每项必须是单键映射（标签名: $变量名），写成字符串列表会让插件 init_worker 抛错
    # matched_uri 已是 http_status 的内置标签，重复添加会导致标签重名
    metrics:
      http_status:
        enabled: true
        extra_labels:
          - route_name: $route_name
      http_latency:
        enabled: true
        extra_labels:
          - route_name: $route_name
  opentelemetry:
    resource:
      service.name: apisix-gateway
    collector:
      address: otel-collector:4318
      request_timeout: 3
    enable_span_name_prefix: true
    set_ngx_var: true
