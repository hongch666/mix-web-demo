upstreams:
  # 普通业务接口统一 30s，流式与长连接接口走单独的 3600s upstream
  - id: spring
    discovery_type: nacos
    service_name: spring
    type: roundrobin
    timeout: { connect: 5, send: 30, read: 30 }
  - id: gozero
    discovery_type: nacos
    service_name: gozero
    type: roundrobin
    timeout: { connect: 5, send: 30, read: 30 }
  - id: gozero-long
    discovery_type: nacos
    service_name: gozero
    type: roundrobin
    timeout: { connect: 5, send: 60, read: 3600 }
  - id: nestjs
    discovery_type: nacos
    service_name: nestjs
    type: roundrobin
    timeout: { connect: 5, send: 30, read: 30 }
  - id: fastapi
    discovery_type: nacos
    service_name: fastapi
    type: roundrobin
    timeout: { connect: 5, send: 30, read: 30 }
  - id: fastapi-stream
    discovery_type: nacos
    service_name: fastapi
    type: roundrobin
    timeout: { connect: 5, send: 3600, read: 3600 }

global_rules:
  - id: global-cors
    plugins:
      cors:
        allow_origins: "**"
        allow_methods: "**"
        allow_headers: "**"
        allow_credential: false
        max_age: 3600
  - id: global-otel
    plugins:
      opentelemetry:
        sampler:
          name: __APISIX_OTEL_SAMPLER__
  - id: global-prometheus
    plugins:
      prometheus: {}

routes:
  - id: health
    uri: /healthz
    priority: 200
    plugins:
      mocking:
        content_type: application/json
        response_status: 200
        response_example: '{"code":200,"msg":"success","data":null}'
  - id: block-internal
    uris:
      [
        /articles/list,
        /articles/stats/batch,
        /comments/batch,
        /users/github/token-ticket,
        /logs,
        /ai_history,
        /upload,
        /email/send-code,
        /task/*,
        /log-deletions/*,
        /articles/statistics/*,
        /comments/statistics/*,
        /comments/internal/*,
        /category/internal/*,
        /likes/statistics/*,
        /collects/statistics/*,
        /focus/statistics/*,
        /users/batch,
        /users/by-name,
        /users/github-user,
        /users/neo4j-sync,
        /users/is-admin/*,
        /articles/batch,
        /articles/by-title,
        /articles/neo4j-sync,
        /comments/neo4j-sync,
        /category/batch,
        /category/sub/batch,
        /likes/neo4j-sync,
        /collects/neo4j-sync,
        /focus/neo4j-sync,
        /api-logs/sync,
        /api-logs/average-speed,
        /api-logs/called-count,
        /article-logs/sync,
        /article-logs/search-keywords,
        /article-logs/search-history/*,
        /article-logs/view-distribution/*,
        /oss/internal/references,
        /analyze/internal/wordcloud-url,
        /task/oss-cleanup,
      ]
    priority: 100
    plugins:
      mocking:
        content_type: application/json
        response_status: 403
        response_example: '{"code":403,"msg":"内部接口禁止外部访问","data":null}'
  - id: auth-public-login
    uri: /users/login
    upstream_id: spring
    # 限流用 local 策略：nginx_config.worker_processes 已收敛到 1，进程内计数即全局计数
    # 因此不接 Redis，也不需要 redis_host / redis_password / redis_database 一组配置
    # 网关扩多 worker 或多副本时配额会按实例数放大，届时须改回 policy: redis 并补齐 redis_* 配置
    # 登录类路由共用该锚点，新增同类路由直接引用 *login_limit
    plugins: &login_limit
      limit-req:
        {
          rate: 1,
          burst: 9,
          nodelay: true,
          key_type: var_combination,
          key: "$remote_addr$uri",
          rejected_code: 429,
          rejected_msg: '{"code":429,"msg":"登录请求过于频繁，请稍后再试","data":null}',
          policy: local,
        }
  - id: auth-public-register
    uri: /users/register
    upstream_id: spring
    plugins: *login_limit
  - id: auth-public-captcha
    uri: /users/captcha
    upstream_id: spring
    plugins: *login_limit
  - id: auth-public-email-send
    uri: /users/email/send
    upstream_id: spring
    plugins: *login_limit
  - id: auth-public-email-login
    uri: /users/email-login
    upstream_id: spring
    plugins: *login_limit
  - id: auth-public-token-refresh
    uri: /users/token/refresh
    upstream_id: spring
    plugins: *login_limit
  - id: auth-public-github-authorize
    uri: /github/authorize
    upstream_id: nestjs
    plugins: *login_limit
  - id: auth-public-github-callback
    uri: /github/callback
    upstream_id: nestjs
    plugins: *login_limit
  - id: auth-public-github-token
    uri: /users/github/token
    upstream_id: spring
    plugins: *login_limit
  # 注册阶段匿名图片上传专用路由，不挂认证；限流比登录接口更严格
  # 定义 &public_upload_limit 锚点供同类匿名上传路由复用（须定义在使用之前）
  - id: auth-public-upload-image
    uri: /upload/public-image
    priority: 10
    upstream_id: nestjs
    plugins: &public_upload_limit
      limit-req:
        {
          rate: 1,
          burst: 8,
          nodelay: true,
          key_type: var_combination,
          key: "$remote_addr$uri",
          rejected_code: 429,
          rejected_msg: '{"code":429,"msg":"图片上传请求过于频繁，请稍后再试","data":null}',
          policy: local,
        }
  - id: swagger-spring
    uri: /swagger/spring.json
    upstream_id: spring
    plugins:
      proxy-rewrite: { uri: /v3/api-docs }
      response-rewrite:
        filters:
          - {
              regex: '"http://localhost:[0-9]+"',
              scope: global,
              replace: '"http://localhost:8080"',
            }
  - id: swagger-gozero
    uri: /swagger/gozero.json
    upstream_id: gozero
    plugins: { proxy-rewrite: { uri: /swagger/doc.json } }
  - id: swagger-nestjs
    uri: /swagger/nestjs.json
    upstream_id: nestjs
    plugins: { proxy-rewrite: { uri: /api-docs-json } }
  - id: swagger-fastapi
    uri: /swagger/fastapi.json
    upstream_id: fastapi
    plugins: { proxy-rewrite: { uri: /openapi.json } }
  - id: gozero-websocket
    uri: /ws/*
    enable_websocket: true
    upstream_id: gozero-long
    plugins: &auth
      forward-auth:
        uri: http://spring:8081/users/internal/auth/validate
        request_headers: [Authorization, X-Access-Token]
        upstream_headers: [X-User-Id, X-Username, X-Session-Id]
        timeout: 30000

  # AI 类路由复用锚点：认证 + 按「token 或 IP」限流
  # forward-auth 在 limit-req 之后执行，此时拿不到 X-User-Id，故用请求自带的 Authorization 头或 query token 作为 key
  # 流式对话建连后长期占用 LLM，限制建连速率即可控制并发规模；扩容多副本时须改回 redis 策略
  - id: fastapi-chat-stream
    uri: /chat/stream
    upstream_id: fastapi-stream
    plugins: &ai_limit
      forward-auth:
        uri: http://spring:8081/users/internal/auth/validate
        request_headers: [Authorization, X-Access-Token]
        upstream_headers: [X-User-Id, X-Username, X-Session-Id]
        timeout: 30000
      limit-req:
        {
          rate: 2,
          burst: 8,
          nodelay: true,
          key_type: var_combination,
          key: "$http_authorization$arg_token$remote_addr",
          rejected_code: 429,
          rejected_msg: '{"code":429,"msg":"请求过于频繁，请稍后再试","data":null}',
          policy: local,
        }
  - id: gozero-sse
    uri: /sse/*
    upstream_id: gozero-long
    plugins: *auth
  - id: spring
    uris:
      [
        /test/spring,
        /users,
        /users/*,
        /articles,
        /articles/*,
        /category,
        /category/*,
        /comments,
        /comments/*,
        /collects,
        /collects/*,
        /likes,
        /likes/*,
        /focus,
        /focus/*,
      ]
    upstream_id: spring
    plugins: *auth
  - id: gozero
    uris: [/test/gozero, /search, /search/*, /user-chat, /user-chat/*]
    upstream_id: gozero
    plugins: *auth
  - id: nestjs
    uris:
      [
        /test/nestjs,
        /article-logs,
        /article-logs/*,
        /api-logs,
        /api-logs/*,
        /download,
        /download/*,
        /github,
        /github/*,
        /email,
        /email/*,
        /table-settings,
        /table-settings/*,
        /upload/image,
        /upload/pdf,
      ]
    upstream_id: nestjs
    plugins: *auth
  # LLM/分析类接口消耗算力与外部模型额度，复用 *ai_limit 单独限流
  - id: fastapi-ai
    uris: [/analyze, /analyze/*, /generate, /generate/*, /chat, /chat/*]
    upstream_id: fastapi
    plugins: *ai_limit
  - id: fastapi
    uris: [/test/fastapi, /ai_history, /ai_history/*]
    upstream_id: fastapi
    plugins: *auth

#END
