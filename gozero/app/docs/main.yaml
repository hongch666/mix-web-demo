basePath: /
consumes:
- application/json
info:
  title: GoZero部分的Swagger文档
  version: 1.0.0
  description: 这是项目的GoZero部分的Swagger文档
  x-author: hongch666
paths:
  /search:
    get:
      description: 根据关键词、用户ID、用户名、发布时间范围等条件搜索文章（支持分页）
      operationId: searchSearchArticlesHandler
      parameters:
      - allowEmptyValue: true
        description: 搜索关键词，可选
        in: query
        name: keyword
        type: string
      - allowEmptyValue: true
        description: 作者用户 ID，可选，传入时须为正整数
        in: query
        name: user_id
        type: integer
      - allowEmptyValue: true
        description: 作者用户名，可选
        in: query
        name: username
        type: string
      - allowEmptyValue: true
        description: 一级分类名，可选
        in: query
        name: category_name
        type: string
      - allowEmptyValue: true
        description: 二级分类名，可选
        in: query
        name: sub_category_name
        type: string
      - allowEmptyValue: true
        description: 发布时间起，可选
        in: query
        name: start_date
        type: string
      - allowEmptyValue: true
        description: 发布时间止，可选，不得早于开始时间
        in: query
        name: end_date
        type: string
      - allowEmptyValue: true
        default: 1
        description: 页码，默认 1，须为正整数
        example: 1
        in: query
        name: page
        type: integer
      - allowEmptyValue: true
        default: 10
        description: 每页条数，默认 10，须为正整数
        example: 10
        in: query
        name: size
        type: integer
      - allowEmptyValue: true
        description: 搜索模式，可选：keyword、hybrid、graph，缺省 hybrid
        in: query
        name: mode
        type: string
      - allowEmptyValue: true
        description: 是否启用向量增强，可选，缺省开启
        in: query
        name: enable_vector
        type: boolean
      - allowEmptyValue: true
        description: 是否启用图谱增强，可选，缺省开启
        in: query
        name: enable_graph
        type: boolean
      - allowEmptyValue: true
        description: 是否返回评分与命中说明，可选
        in: query
        name: explain
        type: boolean
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            properties:
              list:
                description: 当前页文章
                items:
                  properties:
                    ai_comment_count:
                      description: AI 评论数
                      type: integer
                    ai_score:
                      description: AI 评分
                      type: number
                    author_follow_count:
                      description: 作者被关注数
                      type: integer
                    category_name:
                      description: 一级分类名
                      type: string
                    collect_count:
                      description: 收藏数
                      type: integer
                    content:
                      description: 正文
                      type: string
                    create_at:
                      description: 创建时间
                      type: string
                    es_score:
                      description: 关键词检索得分
                      type: number
                    final_score:
                      description: 综合得分
                      type: number
                    graph_score:
                      description: 图谱检索得分
                      type: number
                    id:
                      description: 文章 ID
                      type: integer
                    like_count:
                      description: 点赞数
                      type: integer
                    matched_chunks:
                      description: 命中的向量分片
                      items:
                        properties:
                          article_id:
                            description: 文章 ID
                            type: integer
                          chunk_index:
                            description: 分片序号
                            type: integer
                          content:
                            description: 分片文本
                            type: string
                          score:
                            description: 该分片相似度
                            type: number
                          title:
                            description: 文章标题
                            type: string
                        required:
                        - article_id
                        - title
                        - chunk_index
                        - score
                        - content
                        type: object
                      type: array
                    reason:
                      description: 排序说明
                      type: string
                    relations:
                      description: 命中的图谱关系
                      items:
                        properties:
                          name:
                            description: 关联节点名称
                            type: string
                          reason:
                            description: 命中原因
                            type: string
                          score:
                            description: 关系得分
                            type: number
                          type:
                            description: 关系类型
                            type: string
                        required:
                        - type
                        - name
                        - score
                        - reason
                        type: object
                      type: array
                    score_details:
                      description: 分项得分
                      properties:
                        business_score:
                          description: 业务特征分项
                          type: number
                        es_score:
                          description: 关键词检索分项
                          type: number
                        graph_score:
                          description: 图谱检索分项
                          type: number
                        recency_score:
                          description: 时效分项
                          type: number
                        vector_score:
                          description: 向量检索分项
                          type: number
                      required:
                      - es_score
                      - vector_score
                      - graph_score
                      - business_score
                      - recency_score
                      type: object
                    semantic_reason:
                      description: 语义命中说明
                      type: string
                    status:
                      description: 文章状态，0 草稿，1 已发布
                      type: integer
                    sub_category_name:
                      description: 二级分类名
                      type: string
                    tags:
                      description: 标签
                      type: string
                    title:
                      description: 标题
                      type: string
                    update_at:
                      description: 更新时间
                      type: string
                    user_comment_count:
                      description: 用户评论数
                      type: integer
                    user_id:
                      description: 作者用户 ID
                      type: integer
                    user_score:
                      description: 用户评分
                      type: number
                    username:
                      description: 作者用户名
                      type: string
                    vector_score:
                      description: 向量检索得分
                      type: number
                    views:
                      description: 浏览量
                      type: integer
                  required:
                  - id
                  - title
                  - content
                  - user_id
                  - username
                  - tags
                  - status
                  - views
                  - like_count
                  - collect_count
                  - author_follow_count
                  - category_name
                  - sub_category_name
                  - create_at
                  - update_at
                  - ai_score
                  - user_score
                  - ai_comment_count
                  - user_comment_count
                  - es_score
                  - vector_score
                  - graph_score
                  - final_score
                  - reason
                  - semantic_reason
                  - relations
                  - matched_chunks
                  - score_details
                  type: object
                type: array
              total:
                description: 命中总数
                type: integer
            type: object
      summary: 搜索文章
      tags:
      - 搜索模块
  /search/history/{user_id}:
    get:
      description: 获取指定用户最近10条搜索关键词列表
      operationId: searchGetSearchHistoryHandler
      parameters:
      - description: 用户 ID，路径参数，须为正整数
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            properties:
              keywords:
                description: 最近搜索关键词，最多 10 条
                items:
                  type: string
                type: array
            type: object
      summary: 获取用户搜索历史
      tags:
      - 搜索模块
  /sql-tools/query:
    post:
      consumes:
      - application/json
      description: 执行受限的只读参数化SQL查询，表名白名单控制，强制参数化占位符和LIMIT
      operationId: sqlToolsSqlToolsQueryHandler
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            params:
              additionalProperties:
                type: string
              description: 占位符参数，key 为参数名
              type: object
            query:
              description: 只读 SQL，须使用参数占位符
              type: string
          required:
          - query
          type: object
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            properties:
              data:
                description: 查询结果
                properties:
                  columns:
                    description: 结果列名
                    items:
                      type: string
                    type: array
                  rowCount:
                    description: 返回行数
                    type: integer
                  rows:
                    description: 结果行，每行按列顺序排列
                    items:
                      items:
                        type: string
                      type: array
                    type: array
                required:
                - columns
                - rows
                - rowCount
                type: object
            type: object
      summary: 执行只读参数化SQL查询
      tags:
      - SQL工具模块
  /sql-tools/tables:
    get:
      description: 获取白名单内MySQL表的结构信息，可选指定表名
      operationId: sqlToolsSqlToolsGetTablesHandler
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            table:
              description: 表名，可选；不传则返回白名单内全部表
              type: string
          type: object
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            properties:
              data:
                description: 表结构列表
                items:
                  properties:
                    columns:
                      description: 列信息
                      items:
                        properties:
                          comment:
                            description: 列注释
                            type: string
                          key:
                            description: 键类型，如 PRI
                            type: string
                          name:
                            description: 列名
                            type: string
                          type:
                            description: 列类型
                            type: string
                        required:
                        - name
                        - type
                        - key
                        - comment
                        type: object
                      type: array
                    table:
                      description: 表名
                      type: string
                  required:
                  - table
                  type: object
                type: array
            type: object
      summary: 获取表结构信息
      tags:
      - SQL工具模块
  /sse/chat:
    get:
      description: 建立SSE连接。成功时以 text/event-stream 持续推送数据帧，帧结构见响应模型；参数非法时返回统一 JSON
        错误体
      operationId: chatChatSSEHandler
      parameters:
      - allowEmptyValue: true
        description: 当前用户 ID，可选；传入时须为正整数
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: 连接建立成功，随后持续推送数据帧，每帧对应 ChatSSEMessage
          content: {}
        '400':
          description: 参数非法（如 user_id 非正整数）时返回统一 JSON 错误体
          content:
            application/json:
              schema:
                type: object
      summary: SSE消息通知连接
      tags:
      - 聊天模块
  /task/syncer:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 手动触发同步MySQL文章数据到Elasticsearch
      operationId: taskSyncESHandler
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            type: object
      summary: 手动触发同步ES任务
      tags:
      - 定时任务模块
  /test/gozero:
    get:
      description: 验证GoZero服务是否正常运行
      operationId: testTestGoZeroHandler
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            properties:
              data:
                description: 服务存活提示
                type: string
            type: object
      summary: 测试GoZero服务
      tags:
      - 测试模块
  /user-chat/all-unread-counts:
    post:
      consumes:
      - application/json
      description: 获取指定用户与所有其他用户的未读消息数统计
      operationId: chatChatGetAllUnreadCountsHandler
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            user_id:
              description: 当前用户 ID，须为正整数
              type: integer
          required:
          - user_id
          type: object
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            properties:
              data:
                additionalProperties:
                  type: integer
                description: 各对端未读数，key 为对端用户 ID
                type: object
            type: object
      summary: 获取用户的所有未读消息数
      tags:
      - 聊天模块
  /user-chat/history:
    post:
      consumes:
      - application/json
      description: 分页获取指定两个用户之间的聊天记录
      operationId: chatChatGetHistoryHandler
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            other_id:
              description: 对端用户 ID，须为正整数
              type: integer
            page:
              description: 页码，可选，传入时须为正整数
              type: integer
            size:
              description: 每页条数，可选，传入时须为正整数
              type: integer
            user_id:
              description: 当前用户 ID，须为正整数
              type: integer
          required:
          - user_id
          - other_id
          type: object
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            properties:
              messages:
                description: 当前页聊天记录
                items:
                  properties:
                    content:
                      description: 消息内容
                      type: string
                    created_at:
                      description: 发送时间
                      type: string
                    id:
                      description: 消息 ID
                      type: integer
                    is_read:
                      description: 是否已读，0 未读，1 已读
                      type: integer
                    receiver_id:
                      description: 接收方用户 ID
                      type: integer
                    sender_id:
                      description: 发送方用户 ID
                      type: integer
                  required:
                  - id
                  - sender_id
                  - receiver_id
                  - content
                  - is_read
                  - created_at
                  type: object
                type: array
              total:
                description: 两人之间的消息总数
                type: integer
            type: object
      summary: 获取聊天历史
      tags:
      - 聊天模块
  /user-chat/join:
    post:
      consumes:
      - application/json
      description: 用户手动加入聊天队列，不需要建立WebSocket连接
      operationId: chatChatJoinQueueHandler
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            user_id:
              description: 要加入队列的用户 ID，须为正整数
              type: integer
          required:
          - user_id
          type: object
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            properties:
              status:
                description: 加入结果，已在队列中或刚加入
                type: string
              user_id:
                description: 用户 ID
                type: integer
            type: object
      summary: 手动加入聊天队列
      tags:
      - 聊天模块
  /user-chat/leave:
    post:
      consumes:
      - application/json
      description: 用户手动离开聊天队列
      operationId: chatChatLeaveQueueHandler
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            user_id:
              description: 要离开队列的用户 ID，须为正整数
              type: integer
          required:
          - user_id
          type: object
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            properties:
              status:
                description: 离开结果
                type: string
              user_id:
                description: 用户 ID
                type: integer
            type: object
      summary: 手动离开聊天队列
      tags:
      - 聊天模块
  /user-chat/queue:
    get:
      description: 获取当前在队列中的所有用户
      operationId: chatChatGetQueueStatusHandler
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            properties:
              count:
                description: 在线用户数
                type: integer
              online_users:
                description: 当前在聊天队列中的用户 ID
                items:
                  type: integer
                type: array
            type: object
      summary: 获取队列状态
      tags:
      - 聊天模块
  /user-chat/send:
    post:
      consumes:
      - application/json
      description: 发送聊天消息，先保存到数据库，再通过WebSocket发送给在线用户
      operationId: chatChatSendMessageHandler
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            content:
              description: 消息内容，不能为空白
              type: string
            receiver_id:
              description: 接收方用户 ID，须为正整数
              type: integer
            sender_id:
              description: 发送方用户 ID，须为正整数
              type: integer
          required:
          - sender_id
          - receiver_id
          - content
          type: object
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            properties:
              message_id:
                description: 已保存的消息 ID
                type: integer
            type: object
      summary: 发送聊天消息
      tags:
      - 聊天模块
  /user-chat/unread-count:
    post:
      consumes:
      - application/json
      description: 获取指定用户与另一个用户间的未读消息数
      operationId: chatChatGetUnreadCountHandler
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            other_id:
              description: 发送方用户 ID，须为正整数
              type: integer
            user_id:
              description: 接收方用户 ID，须为正整数
              type: integer
          required:
          - user_id
          - other_id
          type: object
      produces:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            properties:
              unread_count:
                description: 该对端发给当前用户的未读数
                type: integer
            type: object
      summary: 获取两个用户间的未读消息数
      tags:
      - 聊天模块
  /ws/chat:
    get:
      description: 建立WebSocket连接，自动加入聊天队列。握手成功返回 101 升级协议，之后通过文本帧双向通信，帧结构见响应模型
      operationId: chatChatWebsocketHandler
      parameters:
      - allowEmptyValue: true
        description: 当前用户 ID，可选；传入时须为正整数
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        '101':
          description: 协议升级成功（Switching Protocols），之后通过 WebSocket 文本帧双向通信，帧结构对应 ChatWsMessage
        '400':
          description: 参数非法（如 user_id 非正整数）时返回统一 JSON 错误体
          content:
            application/json:
              schema:
                type: object
      summary: WebSocket聊天连接
      tags:
      - 聊天模块
produces:
- application/json
schemes:
- http
swagger: '2.0'
x-date: '2026-09-25 01:57:11'
x-description: This is a goctl generated swagger file.
x-github: https://github.com/zeromicro/go-zero
x-go-zero-doc: https://go-zero.dev/
x-goctl-version: 1.10.2
tags:
- name: 聊天模块
  description: 聊天功能相关API，包括消息发送、历史查询、队列管理等
  x-english-name: chat
- name: 搜索模块
  description: 文章搜索功能相关API，支持多条件搜索、历史记录等
  x-english-name: search
- name: 测试模块
  description: 服务测试相关API，用于验证各个微服务是否正常运行
  x-english-name: test
- name: 定时任务模块
  description: 定时任务相关API，包括手动触发同步ES等任务操作
  x-english-name: task
- name: SQL工具模块
  description: SQL 执行工具相关API，包括表结构查询与只读参数化SQL查询
  x-english-name: sqlTools
