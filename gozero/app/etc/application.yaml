Name: ${SERVER_NAME:gozero}
Host: ${SERVER_IP:127.0.0.1}
Port: ${SERVER_PORT:8082}
Timeout: ${SERVER_TIMEOUT:0}
Mode: ${SERVER_MODE:dev}
Prefix: ${SERVER_PREFIX:/}

grpc:
  enabled: ${GRPC_ENABLED:true}
  port: ${GRPC_PORT:9082}

nacos:
  ipAddr: ${NACOS_IP:127.0.0.1}
  port: ${NACOS_PORT:8848}
  namespace: ${NACOS_NAMESPACE:public}
  serviceName: ${NACOS_SERVICE_NAME:gozero}
  groupName: ${NACOS_GROUP_NAME:DEFAULT_GROUP}
  clusterName: ${NACOS_CLUSTER_NAME:DEFAULT}
  cacheDir: ${NACOS_CACHE_DIR:./tmp/nacos/cache}
  logDir: ${NACOS_LOG_DIR:./tmp/nacos/log}

database:
  mysql:
    host: ${DB_MYSQL_HOST:127.0.0.1}
    port: ${DB_MYSQL_PORT:3306}
    username: ${DB_MYSQL_USERNAME:}
    password: ${DB_MYSQL_PASSWORD:}
    dbname: ${DB_MYSQL_DBNAME:demo}
    charset: ${DB_MYSQL_CHARSET:utf8mb4}
    loc: ${DB_MYSQL_LOC:Local}
    sqlLogEnabled: ${DB_SQL_LOG_ENABLED:true} # SQL普通日志开关，默认启用
    slowThreshold: ${DB_SQL_SLOW_THRESHOLD:500} # 慢查询阈值(毫秒)，默认500ms
  es:
    host: ${DB_ES_HOST:127.0.0.1}
    port: ${DB_ES_PORT:9200}
    username: ${DB_ES_USERNAME:}
    password: ${DB_ES_PASSWORD:}
    sniff: ${DB_ES_SNIFF:false}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
    db: ${REDIS_DB:0}

mq:
  username: ${RABBITMQ_USERNAME:}
  password: ${RABBITMQ_PASSWORD:}
  host: ${RABBITMQ_HOST:127.0.0.1}
  port: ${RABBITMQ_PORT:5672}
  vhost: ${RABBITMQ_VHOST:/}

logs:
  path: ${LOGS_PATH:./logs/gozero}

internal-token:
  secret: ${INTERNAL_TOKEN_SECRET:}
  expiration: ${INTERNAL_TOKEN_EXPIRATION:60000}

# 远程调用配置
remote-call:
  timeout: 10000 # 请求超时时间（毫秒）
  maxRetries: 3 # 最大重试次数
  initialBackoff: 200 # 初始退避时间（毫秒）
  maxBackoff: 2000 # 最大退避时间（毫秒）
  protocol: ${REMOTE_CALL_PROTOCOL:http-only} # grpc-first 或 http-only
  circuitBreaker:
    failureThreshold: 3 # 失败阈值（连续失败次数）
    recoveryTimeout: 15000 # 恢复超时时间（毫秒）
