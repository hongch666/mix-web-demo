server:
  http_listen_port: 9080
  grpc_listen_port: 0
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: service_logs
    static_configs:
      - targets: [localhost]
        labels: {job: service-logs, __path__: /app/logs/spring/app_*.log, service: spring}
      - targets: [localhost]
        labels: {job: service-logs, __path__: /app/logs/gozero/app_*.log, service: gozero}
      - targets: [localhost]
        labels: {job: service-logs, __path__: /app/logs/nestjs/app_*.log, service: nestjs}
      - targets: [localhost]
        labels: {job: service-logs, __path__: /app/logs/fastapi/app_*.log, service: fastapi}
      - targets: [localhost]
        labels: {job: service-logs, __path__: /app/logs/gateway/*.log, service: gateway}
