apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: 'trace_id=([0-9a-f]{32})'
          url: '$${__value.raw}'
          urlDisplayLabel: 查看链路
