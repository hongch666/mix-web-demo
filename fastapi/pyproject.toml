[project]
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pydantic==2.11.9",
  "pytest>=8.0.0",
  "pyyaml==6.0.2",
  "PyJWT>=2.12.1",
  "nacos-sdk-python==2.0.8",
  "httpx[socks]>=0.25.0",
  "tenacity>=9.0.0",
  "sqlalchemy>=2.0.20",
  "pymysql==1.1.1",
  "aiomysql==0.2.0",
  "redis==5.0.1",
  "aio-pika==9.5.5",
  "wordcloud==1.9.4",
  "jieba==0.42.1",
  "pandas==2.3.1",
  "python-multipart==0.0.22",
  "pgvector==0.4.1",
  "psycopg2-binary>=2.9.7",
  "clickhouse-driver>=0.2.0",
  "langchain==1.0.5",
  "langchain-openai==1.0.2",
  "langchain-community==0.4.1",
  "langchain-core==1.2.20",
  "langchain-text-splitters==1.0.0",
  "pypdf>=6.9.1",
  "dashscope>=1.20.0",
  "langsmith>=0.7.3",
  "apscheduler>=3.10.0",
  "python-dotenv>=1.0.0",
  "openpyxl >= 3.1.0",
  "neo4j>=5.28.0",
  "grpcio>=1.67.0",
  "grpcio-tools>=1.67.0",
  "protobuf>=5.28.0",
]
description = "FastAPI微服务"
license = {text = "MIT"}
name = "fastapi-app"
requires-python = ">=3.12"
version = "1.0.0"

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# 仅保留基础错误检查（语法错误、未定义名、未使用导入等），不启用风格类规则
select = ["E4", "E7", "E9", "F"]
ignore = [
  "RUF022", # __all__ 未排序
  "I001",   # 导入块未排序
  "BLE001", # 捕获裸 Exception
]

[tool.pyright]
# 让 Pylance 把 fastapi 目录作为独立执行环境，固定版本与虚拟环境，
# 避免回退到全局解释器导致 PEP 585 泛型（dict[str, Any]）与第三方导入解析失败
include = ["app", "tests", "main.py"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
