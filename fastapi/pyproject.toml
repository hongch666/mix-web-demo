[project]
dependencies = [
  "anyio>=4.0.0",
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pydantic==2.11.9",
  "pytest>=8.0.0",
  "pyyaml==6.0.2",
  "PyJWT>=2.12.1",
  "nacos-sdk-python==2.0.8",
  "httpx[socks]>=0.25.0",
  "tenacity>=9.0.0",
  "sqlalchemy>=2.0.20,<2.0.44",
  "pymysql==1.1.1",
  "aiomysql==0.2.0",
  "redis==5.0.1",
  "aio-pika==9.5.5",
  "wordcloud==1.9.4",
  "jieba==0.42.1",
  "pandas==2.3.1",
  "python-multipart==0.0.22",
  "pgvector==0.4.1",
  "psycopg2-binary>=2.9.7",
  "clickhouse-sqlalchemy>=0.3.2",
  "asynch>=0.2.2,<0.3.0",
  "langchain==1.0.5",
  "langchain-openai==1.0.2",
  "langchain-community==0.4.1",
  "langchain-core==1.2.20",
  "langchain-text-splitters==1.0.0",
  "pypdf>=6.9.1",
  "dashscope>=1.20.0",
  "langsmith>=0.7.3",
  "apscheduler>=3.10.0",
  "python-dotenv>=1.0.0",
  "openpyxl >= 3.1.0",
  "neo4j>=5.28.0",
  "neomodel>=7.0.0",
  "opentelemetry-api~=1.44.0",
  "opentelemetry-sdk~=1.44.0",
  "opentelemetry-exporter-otlp-proto-http~=1.44.0",
  "opentelemetry-instrumentation-fastapi~=0.65b0",
  "opentelemetry-instrumentation-httpx~=0.65b0",
  "opentelemetry-instrumentation-sqlalchemy~=0.65b0",
  "opentelemetry-instrumentation-redis~=0.65b0",
]
description = "FastAPI微服务"
license = {text = "MIT"}
name = "fastapi-app"
requires-python = ">=3.12"
version = "1.0.0"

[dependency-groups]
# 开发期工具，仅本地/CI 安装，不进入运行镜像
dev = [
  "ruff>=0.9.0",
  "pyright>=1.1.390",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
# E4/E7/E9：语法与导入错误；F：未定义名/未使用导入
# B：常见缺陷；SIM：可简化写法；UP：语法升级；ASYNC：异步反模式；S：常见安全问题
select = ["E4", "E7", "E9", "F", "B", "SIM", "UP", "ASYNC", "S"]
ignore = [
  "RUF022",    # __all__ 未排序
  "I001",      # 导入块未排序（现有导入按业务分组，保留人工排序）
  "BLE001",    # 捕获裸 Exception（全局异常处理需要兜底）
  "S101",      # assert（测试与内部参数校验大量使用）
  "S105",      # 字段名/配置键字符串被误判为硬编码密码
  "S311",      # 验证码、抽样等非加密场景使用 random 模块
  "S324",      # 内容指纹使用 md5/sha1 属于预期用法
  "S104",      # 需要监听 0.0.0.0 以便容器访问
  "S108",      # 临时文件路径为占位常量
  "UP045",     # Optional[X] 迁移到 X | None 属于独立重构，先保持现状
  "UP007",     # 同上，保留 Union[X, Y] 写法
  "ASYNC109",  # 异步函数超时由调用方统一控制，不要求内置 timeout 参数
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# 换行符交由 .gitattributes 统一，避免 Windows 工作区误报
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
# 让 Pylance 把 fastapi 目录作为独立执行环境，固定版本与虚拟环境，
# 避免回退到全局解释器导致 PEP 585 泛型（dict[str, Any]）与第三方导入解析失败
include = ["app", "tests", "main.py"]
# 自定义 exclude 会覆盖 pyright 默认项，需显式保留 node_modules / 隐藏目录
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
